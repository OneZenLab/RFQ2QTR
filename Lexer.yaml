# Lexer配置 v2 - 支持 FITTING / FLANGE / BOLT / GASKET 多品类
lexer:
  rules:
    ignore_cols:
      pattern: ^(OLD|.*requirement|Extension|Item No|Part Number|Unit|Price|Unit price|U/P|Total price|T/P|U/weight|T/weight)$
      flags:
      - IGNORECASE
      token_type: IGNORE_COLUMN
    description_columns:
      pattern: ^(Description|DESC|Type|TYPE|Size|SIZE|Comment|COMMENT)$
      flags:
      - IGNORECASE
      token_type: DESCRIPTION_COLUMN
    attr_table_keywords:
      keywords:
      - item
      - qty
      - material
      - description
      - size
      - 序号
      - 数量
      - 订单价格
      - 物料描述
      material_related: true
    column_map:
      token_type: COLUMN_MAPPING
      mappings:
      - source: ^(Item|No\.|Item No.*)$
        target: QTR_LINE
        flags:
        - IGNORECASE
      - source: ^(Material)$
        target: UNI_MATERIAL
        flags:
        - IGNORECASE
      - source: ^(Qty|Q'ty|.*Qty.*|.*Q'ty.*|.*Quantit.*|.*requirement|数量)$
        target: QTR_QTY
        flags:
        - IGNORECASE
      - source: ^(Unit Price|Price|U/P|U-PRICE)$
        target: QTR_PRICE
        flags:
        - IGNORECASE
      - source: ^(SIZE1|DN1)$
        target: UNI_OD1
        flags:
        - IGNORECASE
      - source: ^(SIZE2|DN2)$
        target: UNI_OD2
        flags:
        - IGNORECASE
      - source: ^(END1|END2)$
        target: UNI_END_PREPARATION
        flags:
        - IGNORECASE
      - source: ^(SCH1)$
        target: UNI_WT1
        flags:
        - IGNORECASE
      - source: ^(SCH2)$
        target: UNI_WT2
        flags:
        - IGNORECASE
      - source: ^(Class|Rating|Pressure Class|压力等级|PN)$
        target: UNI_PRESSURE_CLASS
        flags:
        - IGNORECASE
      - source: ^(Facing|Face|端面形式|密封面)$
        target: UNI_FACING
        flags:
        - IGNORECASE
      - source: ^(Grade|Bolt Grade|螺栓等级)$
        target: UNI_BOLT_GRADE
        flags:
        - IGNORECASE
      - source: ^(Length|Bolt Length|螺栓长度)$
        target: UNI_BOLT_LENGTH
        flags:
        - IGNORECASE
      - source: ^(Thread|Thread Type|螺纹类型)$
        target: UNI_THREAD_TYPE
        flags:
        - IGNORECASE
      - source: ^(Gasket Type|垫片类型|垫片形式)$
        target: UNI_GASKET_TYPE
        flags:
        - IGNORECASE
      - source: ^(Thickness|垫片厚度)$
        target: UNI_GASKET_THK
        flags:
        - IGNORECASE
    output_columns:
      pattern: ^(QTR_LINE|QTR_QTY|QTR_PRICE|UNI_CATEGORY|UNI_TYPE|UNI_ANGLE|UNI_RADIUS|UNI_MISC|UNI_OD1|UNI_OD2|UNI_OD3|UNI_WT1|UNI_WT2|UNI_WT3|UNI_DIM_SPEC|UNI_MATERIAL|UNI_CONSTRUCTION|UNI_END_PREPARATION|UNI_PRESSURE_CLASS|UNI_FACING|UNI_BOLT_GRADE|UNI_BOLT_LENGTH|UNI_THREAD_TYPE|UNI_GASKET_TYPE|UNI_GASKET_THK)$
      token_type: OUTPUT_COLUMN
    special_split_separators:
      pattern:
      - /\-
      - \s\*xX
      token_type: SPLIT_SEPARATOR
      target_types:
      - TEE
      - RED
    default_split_separators:
      pattern:
      - /\-
      - \s\*xX
      token_type: SPLIT_SEPARATOR
      default: true
    od_range_pattern:
      pattern: \b((?:\d+|DN\d+|NB\d+))(?:"|')?\s*[\*Xx]\s*((?:\d+|DN\d+|NB\d+))(?:"|')?\b
      token_type: OD_RANGE
      flags:
      - IGNORECASE
    weight_mapping:
      token_type: WEIGHT_MAPPING
      special:
        0: UNI_WT1
        1: UNI_WT3
      default:
        0: UNI_WT1
        1: UNI_WT2
        2: UNI_WT3
    od_mapping:
      token_type: OD_MAPPING
      special:
        0: UNI_OD1
        1: UNI_OD2
      default:
        0: UNI_OD1
        1: UNI_OD2
        2: UNI_OD3
    uni_to_code_map:
      QTR_LINE: 序号
      QTR_QTY: 数量
      QTR_PRICE: 订单价格
      UNI_TYPE: 产品类型
      UNI_ANGLE: 角度
      UNI_RADIUS: 曲率
      UNI_MISC: 其他属性
      UNI_OD1: OD1
      UNI_OD2: OD2
      UNI_OD3: OD3
      UNI_WT1: WT1
      UNI_WT2: WT2
      UNI_WT3: WT3
      UNI_DIM_SPEC: 尺寸标准
      UNI_MATERIAL: 产品材质
      UNI_CONSTRUCTION: 产品结构
      UNI_END_PREPARATION: 端口形式
      UNI_CATEGORY: 品类
      UNI_PRESSURE_CLASS: 压力等级
      UNI_FACING: 密封面形式
      UNI_BOLT_GRADE: 螺栓等级
      UNI_BOLT_LENGTH: 螺栓长度
      UNI_THREAD_TYPE: 螺纹类型
      UNI_GASKET_TYPE: 垫片类型
      UNI_GASKET_THK: 垫片厚度
  enums:
    UNI_CATEGORY:
